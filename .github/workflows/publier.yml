name: Tester et publier

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tests:
        description: "Tests à repasser seulement (ex. tests/sprint23.spec.ts:89 tests/pilotage/ecrans/lot40.spec.ts:21). Vide = toute la suite."
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations de la base rejouées sur un PostgreSQL vide
        run: npm run test:base
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://aipodcpbakywbrrilaud.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Lancement manuel limité (Joseph, 10/11/2026) : seuls les tests demandés repassent avant la mise en ligne
      - run: npx playwright test $TESTS
        env:
          CI: 'true'
          TESTS: ${{ inputs.tests }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: captures/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  publier:
    # La mise en ligne n'a lieu que si tous les tests passent
    if: github.ref == 'refs/heads/main'
    needs: tester
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
